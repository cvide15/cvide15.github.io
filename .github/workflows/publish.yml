name: Publish Book

on:
  push:
    branches: [main]   # triggers on every push to master

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # needed to commit docs/ back to master

    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        run: quarto render

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update published book"
          git push
