project:
  type: book
  output-dir: _site       # build output; never committed to the repo

book:
  title: "Temas de Física Moderna"
  author: "Dr. Jorge Barojas-Weber"
  date: last-modified
  language: es                            # translates UI elements (search, navigation, etc.)
  search: true

  # Uncomment and set once you have a domain — enables sitemap.xml and
  # canonical URLs, both important for SEO
  # site-url: https://yourdomain.com

  # Uncomment to add Google Analytics once the site is live
  # google-analytics: "G-XXXXXXXXXX"

  # Sidebar / table of contents structure.
  # Add new chapters here as they are written.
  chapters:
    - index.qmd
    - part: "Volumen  I.Movimiento"
      chapters:
      
        - chapters/1-conceptualizacion-bimodal.md
        - chapters/1-conceptualizacion-bimodal-1.md
        - chapters/1-conceptualizacion-bimodal-2.md
        - chapters/1-conceptualizacion-bimodal-3.md
        - chapters/2-inteligencia-colectiva-y-propiedades-del-electrón.md
        - chapters/2-inteligencia-colectiva-y-propiedades-del-electrón-1.md
        - chapters/2-inteligencia-colectiva-y-propiedades-del-electrón-2.md
        - chapters/2-inteligencia-colectiva-y-propiedades-del-electrón-3.md
        - chapters/3-detección-de-señales-en-el-ojo-y-creación-de-mapas-en-el-cerebro.md
        - chapters/3-detección-de-señales-en-el-ojo-y-creación-de-mapas-en-el-cerebro-1.md
        - chapters/3-detección-de-señales-en-el-ojo-y-creación-de-mapas-en-el-cerebro-2.md
        - chapters/3-detección-de-señales-en-el-ojo-y-creación-de-mapas-en-el-cerebro-3.md



  # Shown in the page footer
  page-footer:
    left: "© Dr. Jorge Barojas-Weber"
    right:
      - icon: github
        href: https://github.com/your-repo   # update or remove

format:
  html:
    theme: cosmo             # clean, widely-used base theme
    css: assets/custom.css   # typography overrides applied on top
    toc: true
    toc-depth: 3
    number-sections: false   # chapters already carry their own numbering (10.1 …)
    html-math-method: mathjax  # renders physics equations — works without any config in the .md files
    link-external-newwindow: true
    fig-align: center
    grid:
      sidebar-width: 260px
      body-width: 900px
      margin-width: 200px


# Place academic citations here as the book grows
bibliography: references.bib
